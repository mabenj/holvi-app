version: "3.8"
services:
    database:
        build:
            context: ./src/db
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=securepassword
            - POSTGRES_DB=holvi
        volumes:
            - db-data:/var/lib/postgresql/data
        ports:
            - 5432:5432
        networks:
            - holvi-net
        restart: always

    web:
        build:
            context: .
        environment:
            - HOLVI_DB_CONNECTION_STRING=postgres://admin:securepassword@database:5432/holvi
            - HOLVI_SESSION_PASSWORD=generate-a-32-character-long-key-at-https://1password.com/password-generator
            - HOLVI_ENCRYPTION_KEY=generate-an-encryption-ket-at-https://generate-random.org/encryption-key-generator?count=1&bytes=24&cipher=aes-256-ctr&string=&password=
            - HOLVI_DATA_DIR=/app/data
            # Backups are unencrypted. To keep them off the data disk, give them
            # their own volume: set this to /app/backups and mount the
            # backup-data volume below at that path
            - HOLVI_BACKUP_DIR=/app/data/backups
            - HOLVI_USE_HTTPS=false
            - HOLVI_SESSION_TTL_SECONDS=7200
            - HOLVI_MAX_FILE_SIZE_KB=4294967296
            - HOLVI_MAX_TOTAL_FILE_SIZE_KB=17179869184
            - HOLVI_GEO_API_KEY=get-free-api-key-from-https://positionstack.com/product
            # Minutes the random order of each user's collections stays the same
            - HOLVI_SHUFFLE_PERIOD_MINUTES=60
            # Bitrate cap in kbit/s for the web-playable Renditions of videos
            # browsers may not play, such as HEVC
            - HOLVI_RENDITION_MAX_BITRATE_KBPS=10000
        volumes:
            - app-data:/app/data
            # - backup-data:/app/backups
        ports:
            - 7000:3000
        networks:
            - holvi-net
        restart: always

volumes:
    db-data:
    app-data:
    # backup-data:

networks:
    holvi-net:
